components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Role lacks the required permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server or connection error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
        details:
          type: array
          items:
            type: string
          description: Additional error details (e.g., validation errors)
    Role:
      type: string
      enum: [Visitor, Support Agent, Admin]
    EnquiryCategory:
      type: string
      enum: [Feedback, Question, General Enquiry]
    EnquiryStatus:
      type: string
      enum: [New, In Progress, Resolved]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    User:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: string
          maxLength: 64
        lastName:
          type: string
          maxLength: 64
        role:
          $ref: "#/components/schemas/Role"
    SessionResponse:
      type: object
      required: [user, landingPath, idleExpiresAt, absoluteExpiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        landingPath:
          type: string
          description: Role landing page (Visitor to Contact form; Support Agent and Admin to Inbox)
        idleExpiresAt:
          type: string
          format: date-time
          description: 30 minutes after last activity
        absoluteExpiresAt:
          type: string
          format: date-time
          description: 12 hours after sign-in
    Enquiry:
      type: object
      required: [id, name, email, category, comment, status, submittedAt, submittedByEmail]
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 255
          nullable: true
        category:
          $ref: "#/components/schemas/EnquiryCategory"
        comment:
          type: string
          minLength: 10
          maxLength: 2000
        status:
          $ref: "#/components/schemas/EnquiryStatus"
        replyNote:
          type: string
          maxLength: 1000
          nullable: true
          description: Required when status is Resolved
        submittedAt:
          type: string
          format: date-time
        submittedByEmail:
          type: string
          format: email
        handledBy:
          type: string
          nullable: true
    EnquiryList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Enquiry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
